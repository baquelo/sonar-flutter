name: Release

on:
  push:
    tags:
      - 0.*

permissions:
  contents: write  # required to create the GitHub Release and upload the jar

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          check-latest: true
          cache: maven

      # Align the project version with the tag (e.g. tag 0.6.0 -> version 0.6.0).
      - name: Set version from tag
        run: mvn -B versions:set -DnewVersion=${{ github.ref_name }} -DgenerateBackupPoms=false

      - name: Build
        run: mvn -B package

      - name: Publish GitHub Release with the plugin jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            sonar-flutter-plugin/target/sonar-flutter-plugin-*.jar \
            --title "${{ github.ref_name }}" \
            --generate-notes \
          || gh release upload "${{ github.ref_name }}" \
            sonar-flutter-plugin/target/sonar-flutter-plugin-*.jar --clobber
