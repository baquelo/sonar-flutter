name: Release

# Fires when you publish a Release from the GitHub UI (which also creates the
# tag). The job builds the plugin and attaches the jar to that release.
on:
  release:
    types: [published]

permissions:
  contents: write  # required to upload the jar asset to the release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"   # strip an optional leading "v"

      - name: Checkout the released tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ steps.ver.outputs.tag }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          check-latest: true
          cache: maven

      # Align the project version with the release tag (e.g. 0.6.0 -> 0.6.0).
      - name: Set version from release
        run: mvn -B versions:set -DnewVersion=${{ steps.ver.outputs.version }} -DgenerateBackupPoms=false

      - name: Build
        run: mvn -B package

      - name: Attach the plugin jar to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.ver.outputs.tag }}" \
            sonar-flutter-plugin/target/sonar-flutter-plugin-*.jar --clobber
